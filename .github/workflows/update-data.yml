name: Update AE Waiting Data

on:
  schedule:
    # Every 15 min — HA open-data AE waiting time snapshots (rolling 24h history)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest AE waiting data
        run: python update_aed_data.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aed_history.json
            git commit -m "chore: auto-update AE waiting snapshot"
            git push origin main
            echo "Pushed data update"
          else
            echo "No data change"
          fi
